name: Branch-Based Deployment Pipeline

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-branch:
    runs-on: self-hosted

    steps:
      # 1. CLEANUP (Runner Workspace)
      - name: Clean Runner Workspace
        run: |
          echo "🧹 Cleaning previous runner artifacts..."
          rm -rf ./*
          rm -rf ./.??*

      # 2. CHECKOUT
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3. SETUP VARIABLES (Calculate Path EARLY)
      - name: Configure Deployment Paths
        run: |
          # Load Synology Root
          umask 002
          cat ../../conf/syno_paths.env >> $GITHUB_ENV
          
          # Calculate Variables
          BRANCH_NAME="${{ github.ref_name }}"
          REPO_NAME="${{ github.event.repository.name }}"
          
          # Read SYNOLOGY_ROOT_PATH from the file we just loaded
          source ../../conf/syno_paths.env
          TARGET_PATH="${SYNOLOGY_ROOT_PATH}/${BRANCH_NAME}/${REPO_NAME}"
          
          echo "📂 Target Path: $TARGET_PATH"
          echo "DEPLOY_DIR=$TARGET_PATH" >> $GITHUB_ENV

      # 4. DEPLOY CODE (Copy files BEFORE installing deps)
      - name: Sync Code to Project Root
        run: |
          TARGET_PATH="${{ env.DEPLOY_DIR }}"
          mkdir -p "$TARGET_PATH"

          # Wipe OLD source code to ensure deleted files are removed
          # NOTE: We do NOT delete .venv, allowing it to persist!
          echo "🧹 Wiping old src/, tests/, and configs..."
          rm -rf "$TARGET_PATH"/*
          rm -rf "$TARGET_PATH/.venv"
 
          # Copy NEW files to the persistent project root
          echo "🚀 Copying new files..."
          cp -r src "$TARGET_PATH/"
          cp -r tests "$TARGET_PATH/"
          [ -f verify.sh ] && cp verify.sh "$TARGET_PATH/"
          [ -f pyproject.toml ] && cp pyproject.toml "$TARGET_PATH/"
          [ -f pytest.ini ] && cp pytest.ini "$TARGET_PATH/"
          
          sudo chown -R 1026:100 "$TARGET_PATH"
          chmod -R 775 "$TARGET_PATH"
          
          # Copy requirement files if they exist
          [ -f requirements.txt ] && cp requirements.txt "$TARGET_PATH/"
          [ -f requirements.in ] && cp requirements.in "$TARGET_PATH/"

      # 4.5 SETUP PYTHON
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 5. MANAGE VENV (Run execution INSIDE Project Root)
      - name: Update Project Virtualenv
        run: |
          cd "${{ env.DEPLOY_DIR }}"
          
          # 1. Create .venv if missing or if Python version < 3.12
          if [ ! -d ".venv" ] || ! .venv/bin/python -c "import sys; exit(0 if sys.version_info >= (3, 12) else 1)" 2>/dev/null; then
            echo "🔨 Creating new Python 3.13 virtual environment in project root..."
            rm -rf .venv
            python3 -m venv .venv
          else
            echo "✅ Existing .venv found. Updating..."
          fi
          
          # 2. Activate
          source .venv/bin/activate
          pip install --upgrade pip
          
          echo "📦 Installing dependencies..."
          pip install -r requirements.txt
          
          # Inject local common-lib dependency safely
          if [ -d "../common-lib" ]; then
            echo "📦 Installing local common-lib from ../common-lib..."
            pip install -e ../common-lib
          elif [ -d "/volume2/docker/master/common-lib" ]; then
            echo "📦 Installing local common-lib from master..."
            pip install -e /volume2/docker/master/common-lib
          elif [ -d "/volume2/homes/rachardv/git-repos/master/common-lib" ]; then
            echo "📦 Installing local common-lib from master..."
            pip install -e /volume2/homes/rachardv/git-repos/master/common-lib
          fi
          
          # 4. Add to Path
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      # 6. SECRET INJECTION
      - name: Create Runtime .env File
        run: |
          ENV_FILE="${{ env.DEPLOY_DIR }}/.env"
          echo "Generating secure .env file at $ENV_FILE..."
          
          echo "DB_TYPE=postgres" > "$ENV_FILE"
          echo "POSTGRES_HOST=192.168.1.68" >> "$ENV_FILE"
          echo "POSTGRES_PORT=5435" >> "$ENV_FILE"
          echo "POSTGRES_DB=quant_db" >> "$ENV_FILE"
          echo "POSTGRES_USER=quant_admin" >> "$ENV_FILE"
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'quant_secure_pass' }}" >> "$ENV_FILE"
          echo "TE_COOKIE=${{ secrets.TE_COOKIE }}" >> "$ENV_FILE"
          echo "NTFY_ENDPOINT=${{ secrets.NTFY_ENDPOINT }}" >> "$ENV_FILE"
          
          chmod 644 "$ENV_FILE"

      # 7. IN-SITU MODULE SMOKE CHECK
      - name: Verify Module Imports
        run: |
          echo "📡 Verifying unusual-option-flow pipeline module imports on Synology runner..."
          cd "${{ env.DEPLOY_DIR }}"
          export PATH="$(pwd)/.venv/bin:$PATH"
          python -c "import src.extract, src.transform, src.load; print('✅ unusual-option-flow-pipeline modules import cleanly!')"

      # 8. MERGE LOGIC (Unchanged)
      - name: Auto-Promote to Master
        if: github.ref_name == 'develop'
        run: |
          echo "✅ Develop verified. Promoting to Master..."
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git fetch origin develop
          git checkout master
          git pull origin master
          git merge origin/develop --no-ff -m "Auto-merge develop to master [Skip CI]"
          git push origin master